@if (loading()) {
  <div class="flex justify-content-center py-6">
    <p-progress-spinner />
  </div>
} @else {
  <p-card>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="title">Prompt</label>
        <input formControlName="title" pInputText id="title" type="text" class="w-full" />
        <small class="invalid-feedback">Title is required and must be at most 30 characters long.</small>
      </div>
      <div class="field">
        <label for="content">Content</label>
        <textarea formControlName="content" pTextarea id="content" rows="8" class="w-full"></textarea>
        <small class="invalid-feedback">Content is required.</small>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <p-select formControlName="categoryId" inputId="category" [options]="categories()" optionLabel="name" optionValue="id" class="w-full" />
        <small class="invalid-feedback">Category is required.</small>
      </div>
      <div class="flex justify-content-end gap-2">
        @if (promptId()) {
          <p-button [loading]="deletting()" label="Delete" (onClick)="deletePrompt()" severity="danger" [outlined]="true" class="mr-auto" />
        }
        <p-button routerLink="/" label="Cancel" severity="secondary" />
        <p-button [loading]="submitting()" [label]="promptId() ? 'Update' : 'Create'" type="submit" />
      </div>
    </form>
  </p-card>
}
