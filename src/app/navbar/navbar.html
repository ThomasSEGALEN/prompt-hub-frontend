<header class="navbar-shadow p-3 mb-4">
  <div class="container flex justify-content-between align-items-center">
    <a class="navbar-logo flex gap-2 align-items-center">
      <img src="/logo-prompt-hub.png" alt="Prompt Hub Logo" width="36" height="36" />
      Prompt Hub
    </a>
    <div class="flex gap-2">
      <p-button severity="secondary" [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'" size="small" (onClick)="toggleDarkMode()" />
      <p-button label="Add" icon="pi pi-plus" size="small" />
    </div>
  </div>
</header>
