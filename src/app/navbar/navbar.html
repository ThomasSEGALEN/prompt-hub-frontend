<header class="navbar-shadow p-3 mb-4">
  <div class="container flex justify-content-between align-items-center">
    <a routerLink="/" class="navbar-logo flex gap-2 align-items-center">
      <img src="/logo-prompt-hub.png" alt="Prompt Hub Logo" width="36" height="36" />
      Prompt Hub
    </a>
    <div class="flex gap-2 align-items-center">
      @if (authService.currentUser(); as currentUser) {
        <span class="text-small text-color-secondary">{{ currentUser.username }}</span>
        <p-button [loading]="loggingOut()" routerLink="/auth" severity="secondary" label="Logout" size="small" (onClick)="logout()" />
      } @else {
        <p-button routerLink="/auth" severity="secondary" label="Login" size="small" />
      }
      <p-button severity="secondary" [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'" size="small" (onClick)="isDark.update((value) => !value)" />
      <p-button routerLink="/prompts/create" label="Add" icon="pi pi-plus" size="small" />
    </div>
  </div>
</header>
